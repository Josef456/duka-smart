services:
  - type: web
    name: dukasmart-uganda
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app db upgrade && gunicorn app:app
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dukasmart-db
          property: connectionString
databases:
  - name: dukasmart-db
    databaseName: dukasmart
    user: dukasmart
