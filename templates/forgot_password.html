{% extends 'base.html' %}
{% block title %}Reset password{% endblock %}
{% block content %}
<section class="authcard">
    <h1>Reset password</h1>
    <p class="muted">Enter your username and account email. If they match, a one-time reset link will be emailed.</p>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="username">Username</label><input id="username" name="username" maxlength="80" required autocomplete="username">
        <label for="email">Account email</label><input id="email" name="email" type="email" maxlength="254" required autocomplete="email">
        <button class="btn primary full">Send reset instructions</button>
    </form>
</section>
{% endblock %}
