{% extends 'base.html' %}{% block title %}First-time setup{% endblock %}{% block content %}<section class="authcard"><div class="brandmark large">D</div><p class="eyebrow">FIRST-TIME SETUP</p><h1>Create your business administrator</h1><p class="muted">Choose your business name, login and a unique password of at least {{ min_password_length }} characters.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Business name</label><input name="business_name" maxlength="120" required><label>Administrator username</label><input name="username" maxlength="80" required autocomplete="username"><label>Email for password reset</label><input name="email" type="email" maxlength="254" required autocomplete="email"><label>Password ({{ min_password_length }}-256 characters)</label><input name="password" type="password" minlength="{{ min_password_length }}" maxlength="256" required autocomplete="new-password"><button class="btn primary full">Create account</button></form></section>{% endblock %}
