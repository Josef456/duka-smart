{% extends 'base.html' %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<section class="authcard">
    <h1>Choose a new password</h1>
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="new-password">New password ({{ min_password_length }}-256 characters)</label><input id="new-password" name="password" type="password" minlength="{{ min_password_length }}" maxlength="256" required autocomplete="new-password">
        <label for="confirm-password">Confirm new password</label><input id="confirm-password" name="confirm_password" type="password" minlength="{{ min_password_length }}" maxlength="256" required autocomplete="new-password">
        <button class="btn primary full">Reset password</button>
    </form>
</section>
{% endblock %}
